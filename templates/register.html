{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:60px auto;padding:30px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,0.1);">
  <h2>Student Registration</h2>

  <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="student_id" placeholder="Student ID" required style="width:100%;padding:10px;margin:6px 0;"><br>
    <input type="text" name="name" placeholder="Full Name" required style="width:100%;padding:10px;margin:6px 0;"><br>
    <input type="text" name="course" placeholder="Course (e.g. B.Tech CSE)" style="width:100%;padding:10px;margin:6px 0;"><br>
    <input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin:6px 0;"><br>

    <p style="font-size:12.5px;color:#64748b;margin:14px 0 4px;">Set a security question — used to reset your password if you forget it (optional but recommended)</p>
    <select name="security_question" style="width:100%;padding:10px;margin:6px 0;">
      <option value="">-- Skip (no password recovery) --</option>
      {% for q in security_questions %}
      <option value="{{ q }}">{{ q }}</option>
      {% endfor %}
    </select>
    <input type="text" name="security_answer" placeholder="Your answer" style="width:100%;padding:10px;margin:6px 0;"><br>

    <button type="submit" style="width:100%;padding:10px;margin-top:10px;">Register</button>
  </form>

  <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
