{% extends "base.html" %}

{% block content %}

<style>
:root {
    --brand-purple: #7c3aed;
    --brand-dark: #0f172a;
    --text-slate: #64748b;
}

.elig-page {
    background: #ffffff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--brand-dark);
}

.elig-hero {
    background: var(--brand-dark);
    background-image:
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.4) 0, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.3) 0, transparent 50%);
    color: white;
    padding: 90px 20px 70px;
    text-align: center;
}

.elig-hero h1 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 14px;
}

.elig-hero p {
    color: #cbd5f5;
    font-size: 18px;
    max-width: 620px;
    margin: 0 auto;
}

.elig-wrap {
    max-width: 760px;
    margin: -50px auto 80px;
    padding: 0 20px;
}

.elig-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
    padding: 40px;
}

.elig-card label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
    margin-top: 20px;
}

.elig-card label:first-of-type {
    margin-top: 0;
}

.elig-card select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    font-size: 16px;
    background: #f8fafc;
}

.elig-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: var(--brand-purple);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 28px;
}

.elig-btn:hover {
    background: #6d28d9;
}

.elig-result {
    margin-top: 28px;
    display: none;
    padding: 22px;
    border-radius: 14px;
}

.elig-result.show {
    display: block;
}

.elig-result.eligible {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
}

.elig-result.check {
    background: #fffbeb;
    border: 1px solid #fde68a;
}

.elig-result h3 {
    margin: 0 0 10px;
    font-size: 18px;
}

.elig-result p {
    color: var(--text-slate);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 8px;
}

.elig-result a {
    color: var(--brand-purple);
    font-weight: 700;
}
</style>

<div class="elig-page">

    <div class="elig-hero">
        <h1>Eligibility Checker</h1>
        <p>Answer a few quick questions to see whether you generally meet the entry requirements for your chosen program.</p>
    </div>

    <div class="elig-wrap">
        <div class="elig-card">

            <label for="courseSelect">Which course are you interested in?</label>
            <select id="courseSelect">
                <option value="">-- Choose a course --</option>
                {% for c in courses %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>

            <label for="levelSelect">What's your current qualification?</label>
            <select id="levelSelect">
                <option value="">-- Select --</option>
                <option value="10th">Completed Class 10</option>
                <option value="12th">Completed / appearing Class 12</option>
                <option value="bachelors">Completed / pursuing Bachelor's degree</option>
                <option value="masters">Completed Master's degree</option>
            </select>

            <label for="examSelect">Have you taken (or plan to take) a relevant entrance exam?</label>
            <select id="examSelect">
                <option value="yes">Yes (JEE / NEET / CLAT / GUJCET / university test etc.)</option>
                <option value="no">Not yet</option>
                <option value="na">Not applicable for my course</option>
            </select>

            <button class="elig-btn" onclick="checkEligibility()">Check Eligibility</button>

            <div class="elig-result" id="eligResult"></div>

        </div>
    </div>

</div>

<script>
function checkEligibility() {
    const course = document.getElementById('courseSelect').value;
    const level = document.getElementById('levelSelect').value;
    const exam = document.getElementById('examSelect').value;
    const box = document.getElementById('eligResult');

    box.classList.remove('show', 'eligible', 'check');

    if (!course || !level) {
        box.innerHTML = "<p>Please select both a course and your current qualification.</p>";
        box.classList.add('show', 'check');
        return;
    }

    const isPG = /M\.|MBA|MSc|M\.Tech|M\.Com|M\.Pharm|MA\b|Master/i.test(course);
    const requiredLevel = isPG ? "bachelors" : "12th";

    const levelRank = { "10th": 1, "12th": 2, "bachelors": 3, "masters": 4 };
    const meetsLevel = levelRank[level] >= levelRank[requiredLevel];

    let html = "";
    let cls = "";

    if (!meetsLevel) {
        cls = "check";
        html = `
            <h3>⚠️ You may not meet the minimum qualification yet</h3>
            <p>${course} typically requires you to have ${requiredLevel === 'bachelors' ? "completed a Bachelor's degree" : "completed (or be appearing for) Class 12"} first.</p>
            <p>Ask <a href="/chatbot">Campus AI</a> about specific subject/percentage requirements for ${course}, since these vary by program.</p>
        `;
    } else if (exam === "no" && isPG === false) {
        cls = "check";
        html = `
            <h3>🟡 Likely eligible — entrance exam still pending</h3>
            <p>Your qualification level generally fits ${course}. Many programs also require an entrance exam (university-conducted or national-level) as part of admission — plan to take yours soon.</p>
            <p>See the full <a href="/admission">admission process</a> for exact next steps.</p>
        `;
    } else {
        cls = "eligible";
        html = `
            <h3>✅ You generally meet the basic eligibility</h3>
            <p>Based on your qualification level, you meet the general entry requirement for ${course}. Exact criteria (minimum percentage, specific subjects, category-based relaxation) can still vary by program.</p>
            <p>For a precise, course-specific confirmation, ask <a href="/chatbot">Campus AI</a> or start your <a href="/admission">application</a>.</p>
        `;
    }

    box.innerHTML = html;
    box.classList.add('show', cls);
}
</script>

{% endblock %}
